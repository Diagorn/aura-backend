metrics:
  get:
    tags:
      - catalog
    operationId: listMetrics
    summary: Список отслеживаемых метрик
    description: >
      Системные пресеты и персональные метрики пользователя (настроение, энергия, тревожность…),
      отсортированные по sortOrder. Деактивированные персональные и скрытые вами системные —
      только с includeInactive=true (в ответе isActive=false).
    parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Метрики
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/catalog.yaml#/MetricResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
  post:
    tags:
      - catalog
    operationId: createMetric
    summary: Создать персональную метрику
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/catalog.yaml#/CreateMetricRequest'
    responses:
      '201':
        description: Метрика создана
        content:
          application/json:
            schema:
              $ref: '../components/schemas/catalog.yaml#/MetricResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

metric:
  patch:
    tags:
      - catalog
    operationId: updateMetric
    summary: Изменить/деактивировать свою метрику
    description: >
      PATCH-семантика: изменяются только переданные поля; minValue должен быть меньше maxValue.
      Персональная метрика правится владельцем. Системная: {isActive:false|true} — скрыть/вернуть
      для себя; правка полей — только ADMIN, иначе 403. Чужая/несуществующая — 404.
    parameters:
      - $ref: '../components/parameters.yaml#/itemId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/catalog.yaml#/UpdateMetricRequest'
    responses:
      '200':
        description: Метрика обновлена
        content:
          application/json:
            schema:
              $ref: '../components/schemas/catalog.yaml#/MetricResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
  delete:
    tags:
      - catalog
    operationId: deleteMetric
    summary: Удалить свою метрику
    description: >
      Удаляются только персональные метрики их владельцем; системные не удаляются никем (403),
      чужие/несуществующие — 404.
    parameters:
      - $ref: '../components/parameters.yaml#/itemId'
    responses:
      '204':
        description: Метрика удалена
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
