databaseChangeLog:
  - changeSet:
      id: note-000-create-schema
      author: Diagorn
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM pg_namespace WHERE nspname = 'note'
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS note
