name: CI

on:
  push:
    # Все ветки («**» — включая имена со слешами; пуш тегов триггерит только фильтр tags)
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (tests + detekt)
        run: ./gradlew build

      - name: Validate OpenAPI spec
        run: npx @redocly/cli@latest lint --config api/redocly.yaml api/openapi/api.yaml
