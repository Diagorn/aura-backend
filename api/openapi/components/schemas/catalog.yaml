EmotionResponse:
  type: object
  required:
    - id
    - name
    - isActive
    - sortOrder
    - system
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
      maxLength: 100
    color:
      type: integer
      format: int32
      minimum: 0
      maximum: 16777215
      description: RGB-цвет для UI; null — цвет не выбран
      nullable: true
    icon:
      type: string
      maxLength: 128
      nullable: true
    isActive:
      type: boolean
      description: false — деактивирована пользователем и по умолчанию не отдаётся в списке
    sortOrder:
      type: integer
      format: int32
      description: Порядок в списке; меньше — выше
    system:
      type: boolean
      description: true — системный пресет, общий для всех; править нельзя (см. PATCH/DELETE)

