openapi: 3.0.3
info:
  title: Aura API
  description: |
    REST API трекера эмоций Aura.

    Конвенции: версия в пути (/api/v1), ошибки — RFC 9457 (application/problem+json),
    пагинация page/size, периоды выборок — from/to либо period=week|month|half_year|year.
    Полные правила — docs/api-design.md. Спека — источник истины для сервера, фронтенда и Telegram-бота.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Локальная разработка
tags:
  - name: me
    description: Профиль текущего пользователя
  - name: auth
    description: Аутентификация, регистрация и связка с Telegram
  - name: catalog
    description: >
      Справочники чек-ина: эмоции, факторы, события, отслеживаемые метрики.
      Паттерн «системное + персональное»: системные пресеты общие, править их
      могут только админы; пользователи создают свои и деактивируют свои.
  - name: internal
    description: >
      Внутренний API для Telegram-бота; аутентификация — сервисный JWT
      (typ=service, scope=internal). Не публикуется во внешней документации.
security:
  - bearerAuth: []
paths:
  /api/v1/me:
    $ref: './paths/me.yaml#/me'
  /api/v1/me/password:
    $ref: './paths/me.yaml#/mePassword'
  /api/v1/auth/register:
    $ref: './paths/auth.yaml#/register'
  /api/v1/auth/login:
    $ref: './paths/auth.yaml#/login'
  /api/v1/auth/refresh:
    $ref: './paths/auth.yaml#/refresh'
  /api/v1/auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /api/v1/auth/telegram/link-code:
    $ref: './paths/auth.yaml#/telegramLinkCode'
  /api/v1/catalog/emotions:
    $ref: './paths/catalog.yaml#/emotions'
  /api/v1/catalog/emotions/{id}:
    $ref: './paths/catalog.yaml#/emotion'
  /api/v1/catalog/factors:
    $ref: './paths/catalog.yaml#/factors'
  /api/v1/catalog/factors/{id}:
    $ref: './paths/catalog.yaml#/factor'
  /api/v1/catalog/events:
    $ref: './paths/catalog.yaml#/events'
  /api/v1/catalog/events/{id}:
    $ref: './paths/catalog.yaml#/event'
  /api/v1/catalog/metrics:
    $ref: './paths/catalog.yaml#/metrics'
  /api/v1/catalog/metrics/{id}:
    $ref: './paths/catalog.yaml#/metric'
  /internal/v1/auth/service-token:
    $ref: './paths/internal.yaml#/serviceToken'
  /internal/v1/auth/telegram/link:
    $ref: './paths/internal.yaml#/telegramLink'
  /internal/v1/auth/telegram/exchange:
    $ref: './paths/internal.yaml#/telegramExchange'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
