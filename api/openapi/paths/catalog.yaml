# Единый шаблон для четырёх справочников чек-ина: emotions, factors, events, metrics.
# Системные элементы (system=true) общие для всех; править их могут только админы (см. этап 2.2),
# пользователи создают персональные копии и деактивируют свои.

emotions:
  get:
    tags:
      - catalog
    operationId: listEmotions
    summary: Список эмоций
    description: >
      Системные пресеты и персональные эмоции пользователя, отсортированные по sortOrder.
      Деактивированные персональные и скрытые вами системные — только с includeInactive=true
      (в ответе isActive=false).
    parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Эмоции
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/catalog.yaml#/EmotionResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
  post:
    tags:
      - catalog
    operationId: createEmotion
    summary: Создать персональную эмоцию
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/catalog.yaml#/CreateEmotionRequest'
    responses:
      '201':
        description: Эмоция создана
        content:
          application/json:
            schema:
              $ref: '../components/schemas/catalog.yaml#/EmotionResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

emotion:
  patch:
    tags:
      - catalog
    operationId: updateEmotion
    summary: Изменить/деактивировать свою эмоцию
    description: >
      PATCH-семантика: изменяются только переданные поля. Персональная эмоция правится
      владельцем. Системная: {isActive:false|true} — скрыть/вернуть для себя; правка полей —
      только ADMIN, иначе 403. Чужая или несуществующая эмоция — 404 (не раскрываем).
    parameters:
      - $ref: '../components/parameters.yaml#/itemId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/catalog.yaml#/UpdateEmotionRequest'
    responses:
      '200':
        description: Эмоция обновлена
        content:
          application/json:
            schema:
              $ref: '../components/schemas/catalog.yaml#/EmotionResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
  delete:
    tags:
      - catalog
    operationId: deleteEmotion
    summary: Удалить свою эмоцию
    description: >
      Удаляются только персональные эмоции их владельцем; системные не удаляются никем (403),
      чужие/несуществующие — 404.
    parameters:
      - $ref: '../components/parameters.yaml#/itemId'
    responses:
      '204':
        description: Эмоция удалена
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

