MetricResponse:
  type: object
  required:
    - id
    - name
    - minValue
    - maxValue
    - isActive
    - sortOrder
    - system
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
      maxLength: 100
    minValue:
      type: number
      description: Нижняя граница шкалы (по умолчанию 1)
    maxValue:
      type: number
      description: Верхняя граница шкалы (по умолчанию 5)
    unit:
      type: string
      maxLength: 16
      description: Единица измерения, опционально
      nullable: true
    isActive:
      type: boolean
      description: false — деактивирована пользователем и по умолчанию не отдаётся в списке
    sortOrder:
