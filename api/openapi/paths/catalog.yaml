# Единый шаблон для четырёх справочников чек-ина: emotions, factors, events, metrics.
# Системные элементы (system=true) общие для всех; править их могут только админы (см. этап 2.2),
# пользователи создают персональные копии и деактивируют свои.

emotions:
  get:
    tags:
      - catalog
    operationId: listEmotions
    summary: Список эмоций
    description: >
      Системные пресеты и персональные эмоции пользователя, отсортированные по sortOrder.
      По умолчанию деактивированные не отдаются; includeInactive=true добавляет их.
    parameters:
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Эмоции
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/catalog.yaml#/EmotionResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
  post:
    tags:
      - catalog
    operationId: createEmotion
    summary: Создать персональную эмоцию
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/catalog.yaml#/CreateEmotionRequest'
    responses:
      '201':
        description: Эмоция создана
        content:
          application/json:
            schema:
              $ref: '../components/schemas/catalog.yaml#/EmotionResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'

emotion:
  patch:
    tags:
      - catalog
    operationId: updateEmotion
    summary: Изменить/деактивировать свою эмоцию
    description: >
      PATCH-семантика: изменяются только переданные поля. Правка чужой или несуществующей
      эмоции — 404 (существование чужого не раскрываем); правка системной — 403.
    parameters:
      - $ref: '../components/parameters.yaml#/itemId'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/catalog.yaml#/UpdateEmotionRequest'
    responses:
      '200':
        description: Эмоция обновлена
        content:
          application/json:
            schema:
              $ref: '../components/schemas/catalog.yaml#/EmotionResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'
      '422':
        $ref: '../components/responses.yaml#/ValidationFailed'
  delete:
    tags:
      - catalog
    operationId: deleteEmotion
    summary: Удалить свою эмоцию
    description: Удаляются только персональные эмоции; системная — 403, чужая/несуществующая — 404.
    parameters:
      - $ref: '../components/parameters.yaml#/itemId'
    responses:
      '204':
        description: Эмоция удалена
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

