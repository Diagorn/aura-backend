# Системные пресеты эмоций (context: seed) — см. docs/domain-model.md «Системные пресеты».
# Идемпотентность: если системный набор уже есть (count > 0), changeset пропускается (MARK_RAN).
# Пополнять набор должен ADMIN через API (PATCH системных) или отдельный чейнджсет окружения.
